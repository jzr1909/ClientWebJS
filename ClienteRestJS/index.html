<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Formulario CRUD</title>
</head>
<body>
    <script src="cliente.js"></script>
    <div class="container mt-5" id="informacion">
        <div class="card">
            <h3 class="card-header">Gestión de Productos</h3>
            <div class="card-body">
                <h5 class="card-title">¡Formulario para Registro, Actualización y Eliminación!</h5>
                <p class="card-text">
                    En este formulario puedes registrar un producto, buscarlo por documento para
                    actualizar su información o eliminarlo.
                </p><br>
                <form>
                    <div class="row justify-content-end">
                        <div class="col-md-8 mb-3">
                            <input type="text" class="form-control" id="codigo" placeholder="Codigo" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <input type="button" class="btn btn-primary w-100" value="Buscar" onclick="obtenerProducto()">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <input type="text" class="form-control" id="nombre" placeholder="Nombre" required="Teléfono" required>
                            
                        </div>
                        <div class="col-md-4 mb-3">
                            <input type="text" class="form-control" id="descripcion" placeholder="Descripcion"> 
                        </div>
                            <div class="col-md-4 mb-3">
                                <input type="number" class="form-control" id="precio" placeholder="Precio" min="1" required>
                            </div>
                    </div>
                        
                            
                            
                        
                        
                        <div class="row justify-content-end">
                            <div class="col-md-auto">
                                <input type="button" class="btn btn-primary" value="Registrar" onclick="registrarProducto()">
                            </div>
                            <div class="col-md-auto">
                                <input type="button" class="btn btn-success" value="Actualizar" onclick="actualizarProducto()">
                            </div>
                            <div class="col-md-auto">
                                <input type="button" class="btn btn-danger" value="Eliminar" onclick="eliminarProducto()">
                            </div>
                            <div class="col-md-auto">
                                <input type="button" class="btn btn-primary" value="Lista Completa" onclick="obtenerListaProductos()">
                            </div>
                        </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
